<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DG Pro: Persistent Scorer</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="tab-bar">
        <button class="tab-btn active" onclick="showPage('scorePage', this)">SCORE</button>
        <button class="tab-btn" onclick="showPage('mapPage', this)">MAP</button>
        <button class="tab-btn" onclick="showPage('settingsPage', this)">SETTINGS</button>
    </div>

    <div class="content-area">
        <div id="scorePage" class="page active">
            
            <div id="setupContainer" class="setup-form">
                <div id="resumeSection" class="hidden">
                    <h3 id="resumeTitle">Game in Progress</h3>
                    <button class="btn-start" onclick="resumeGame()">Resume Active Game</button>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="btn-start" style="flex: 1; background: #8e44ad;" onclick="startQRScanner()">Import QR</button>
                        <button class="btn-reset btn-danger" style="flex: 1;" onclick="confirmNewGame()">Discard & New</button>
                    </div>
                </div>
                
                <div id="newGameSection">
                    <h3>New Round</h3>
                    <label>Number of Players: </label>
                    <input type="number" id="count" min="1" max="10" value="1" oninput="drawNameInputs()">
                    <div id="nameInputs"></div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="btn-start" style="flex: 1;" onclick="initNewGame()">Start Game</button>
                        <button class="btn-start" style="flex: 1; background: #8e44ad;" onclick="startQRScanner()">Import QR</button>
                    </div>
                </div>
            </div>

            <div id="gameContainer" class="hidden">
                <div class="table-wrapper">
                    <table id="scoreTable">
                        <thead><tr id="hRow"></tr></thead>
                        <tbody id="sBody"></tbody>
                        <tfoot><tr id="fRow"></tr></tfoot>
                    </table>
                </div>
                <div class="game-footer" style="display: flex; gap: 10px;">
                    <button class="btn-share" onclick="generateShareQR()" style="background: #3498db; color: white; padding: 15px; border: none; border-radius: 8px; font-weight: bold; flex: 1; cursor: pointer;">Share Round</button>
                    <button class="btn-archive" onclick="saveToHistoryAndReset()" style="flex: 1; padding: 15px;">Archive & Reset</button>
                </div>
            </div>
        </div>

        <div id="mapPage" class="page">
            <div id="map"></div>
            <div class="map-controls">
                <button id="btnFollow" class="map-btn active" onclick="setMapMode('follow')">Follow</button>
                <button id="btnFree" class="map-btn" onclick="setMapMode('free')">Free</button>
                <button class="map-btn" onclick="centerOnMe()">📍 Center</button>
            </div>
        </div>

        <div id="settingsPage" class="page">
            <div class="settings-content">
                <h3>Location & Sharing</h3>
                <div class="setting-item">
                    <span>High Precision GPS</span>
                    <input type="checkbox" id="setHighAcc" onchange="updateGPSConfig()">
                </div>
                <div class="setting-item">
                    <span>High Contrast Scorecard</span>
                    <input type="checkbox" id="setHighContrast" onchange="toggleHighContrast()">
                </div>
                <div id="qrcode"></div>
                <hr>
                <h3>Game History & Data</h3>
                <p style="font-size: 0.8rem; color: #666;">Tap a round to reload it into the scorecard.</p>
                <div id="historyList"></div>
                <button class="btn-danger" onclick="clearHistory()" style="margin-bottom: 10px;">Clear All Data</button>
                <button class="btn-share" onclick="exportTeeData()" style="width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Export Tee Coordinates (CSV)</button>
            </div>
        </div>
    </div>
</div>

<div id="qrModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: rgba(0,0,0,0.95); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;">
    <h2 style="color: white; margin-bottom: 20px;">Scan to Import Game</h2>
    <div id="modalQRCode" style="background: white; padding: 20px; border-radius: 8px;"></div>
    <p style="color: #ccc; margin-top: 15px; text-align: center; font-size: 0.9rem;">Present this code to the other players.</p>
    <button onclick="document.getElementById('qrModal').classList.add('hidden')" style="margin-top: 30px; background: #e74c3c; color: white; padding: 15px 40px; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer;">Close</button>
</div>

<div id="scannerModal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100dvh; background: rgba(0,0,0,0.95); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;">
    <h2 style="color: white; margin-bottom: 20px;">Scan Game QR</h2>
    <div id="reader" style="width: 100%; max-width: 400px; background: white; border-radius: 8px; overflow: hidden;"></div>
    <button onclick="stopQRScanner()" style="margin-top: 30px; background: #e74c3c; color: white; padding: 15px 40px; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1rem; cursor: pointer;">Cancel</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="app.js"></script>
</body>
</html>
