
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DG Pro: Persistent Scorer</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="tab-bar">
        <button class="tab-btn active" onclick="showPage('scorePage', this)">SCORE</button>
        <button class="tab-btn" onclick="showPage('mapPage', this)">MAP</button>
        <button class="tab-btn" onclick="showPage('settingsPage', this)">SETTINGS</button>
    </div>

    <div class="content-area">
        <div id="scorePage" class="page active">
            
            <div id="setupContainer" class="setup-form">
                <div id="resumeSection" class="hidden">
                    <h3 id="resumeTitle">Game in Progress</h3>
                    <button class="btn-start" onclick="resumeGame()">Resume Active Game</button>
                    <button class="btn-reset btn-danger" style="margin-top:10px;" onclick="confirmNewGame()">Discard & New Game</button>
                </div>
                
                <div id="newGameSection">
                    <h3>New Round</h3>
                    <label>Number of Players: </label>
                    <input type="number" id="count" min="1" max="10" value="1" oninput="drawNameInputs()">
                    <div id="nameInputs"></div>
                    <button class="btn-start" onclick="initNewGame()">Start Game</button>
                </div>
            </div>

            <div id="gameContainer" class="hidden">
                <div class="table-wrapper">
                    <table id="scoreTable">
                        <thead><tr id="hRow"></tr></thead>
                        <tbody id="sBody"></tbody>
                        <tfoot><tr id="fRow"></tr></tfoot>
                    </table>
                </div>
                <div class="game-footer">
                    <button class="btn-archive" onclick="saveToHistoryAndReset()">Finish & Archive Round</button>
                </div>
            </div>
        </div>

        <div id="mapPage" class="page">
            <div id="map"></div>
            <div class="map-controls">
                <button id="btnFollow" class="map-btn active" onclick="setMapMode('follow')">Follow</button>
                <button id="btnFree" class="map-btn" onclick="setMapMode('free')">Free</button>
                <button class="map-btn" onclick="centerOnMe()">📍 Center</button>
            </div>
        </div>

        <div id="settingsPage" class="page">
            <div class="settings-content">
                <h3>Location Settings</h3>
                <div class="setting-item">
                    <span>High Precision GPS</span>
                    <input type="checkbox" id="setHighAcc" onchange="updateGPSConfig()">
                </div>
                <hr>
                <h3>Game History</h3>
                <p style="font-size: 0.8rem; color: #666;">Tap a round to reload it into the scorecard.</p>
                <div id="historyList"></div>
                <button class="btn-danger" onclick="clearHistory()">Clear All Data</button>
                <div id="qrcode"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
